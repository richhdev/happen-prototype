<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lighthouse reports</title>
    <style>
        :root {
            color-scheme: dark;
            --color-red: #ca0013;
            --color-charcoal: #111111;
            --color-grey-900: #191919;
            --color-grey-700: #433b3a;
            --color-grey-500: #706058;
            --color-cream: #ebe6de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: var(--color-charcoal);
            color: var(--color-cream);
            font-family:
                Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: clamp(30px, calc(25.19px + 1.235vw), 40px);
            line-height: 1.1;
            letter-spacing: -0.02em;
            font-weight: 600;
        }

        p {
            margin-top: 8px;
            color: var(--color-grey-500);
            font-size: 16px;
            line-height: 24px;
        }

        ul {
            margin-top: 40px;
            list-style: none;
            display: grid;
            gap: 8px;
        }

        a {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 20px 24px;
            border: 1px solid var(--color-grey-700);
            border-radius: 8px;
            background: var(--color-grey-900);
            color: inherit;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition:
                border-color 150ms ease,
                background 150ms ease;
        }

        a:hover,
        a:focus-visible {
            border-color: var(--color-red);
            background: #1f1f1f;
        }

        a span {
            margin-left: auto;
            color: var(--color-grey-500);
            font-size: 14px;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <main>
        <h1>Lighthouse reports</h1>
        <ul>
            <li><a href="./mobile/">Mobile<span>View report</span></a></li>
            <li><a href="./desktop/">Desktop<span>View report</span></a></li>
        </ul>
    </main>
</body>

</html>
